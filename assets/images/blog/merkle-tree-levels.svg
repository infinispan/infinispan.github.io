:#222222;stroke-width:1;'/><rect fill='#ADD8E6' height='61.9063' rx='12.5' ry='12.5' style='stroke:#000080;stroke-width:0.5;' width='231.377' x='333.4238' y='282.8438'/><text fill='#000000' font-family='sans-serif' font-size='12' font-weight='bold' lengthAdjust='spacing' textLength='201.6211' x='348.3018' y='303.9824'>Level 3: Selective Entry Fetch</text><text fill='#000000' font-family='sans-serif' font-size='12' font-weight='bold' lengthAdjust='spacing' textLength='211.377' x='343.4238' y='317.9512'>Fetch entries ONLY for buckets</text><text fill='#000000' font-family='sans-serif' font-size='12' font-weight='bold' lengthAdjust='spacing' textLength='181.5996' x='358.3125' y='331.9199'>whose hashes mismatched</text><ellipse cx='449.1123' cy='390.75' fill='none' rx='11' ry='11' style='stroke:#222222;stroke-width:1;'/><ellipse cx='449.1123' cy='390.75' fill='#222222' rx='6' ry='6' style='stroke:#222222;stroke-width:1;'/><line style='stroke:#181818;stroke-width:1;' x1='215.717' x2='215.717' y1='30' y2='50'/><polygon fill='#181818' points='211.717,40,215.717,50,219.717,40,215.717,44' style='stroke:#181818;stroke-width:1;'/><line style='stroke:#181818;stroke-width:1;' x1='82.5146' x2='82.5146' y1='185.9063' y2='220.9063'/><polygon fill='#181818' points='78.5146,210.9063,82.5146,220.9063,86.5146,210.9063,82.5146,214.9063' style='stroke:#181818;stroke-width:1;'/><line style='stroke:#181818;stroke-width:1;' x1='248.7266' x2='248.7266' y1='316.8125' y2='351.8125'/><polygon fill='#181818' points='244.7266,341.8125,248.7266,351.8125,252.7266,341.8125,248.7266,345.8125' style='stroke:#181818;stroke-width:1;'/><line style='stroke:#181818;stroke-width:1;' x1='449.1123' x2='449.1123' y1='344.75' y2='379.75'/><polygon fill='#181818' points='445.1123,369.75,449.1123,379.75,453.1123,369.75,449.1123,373.75' style='stroke:#181818;stroke-width:1;'/><line style='stroke:#181818;stroke-width:1;' x1='267.0173' x2='248.7266' y1='260.8438' y2='260.8438'/><line style='stroke:#181818;stroke-wid