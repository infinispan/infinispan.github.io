.6667 L275.0346,281.25' fill='url(#gqs4lm54duhjd1)' style='stroke:#033C73;stroke-width:1.0417;'/><text fill='#FFFFFF' font-family='sans-serif' font-size='12.5' lengthAdjust='spacing' textLength='161.4929' x='103.125' y='303.2694'>Operation completes only</text><text fill='#FFFFFF' font-family='sans-serif' font-size='12.5' lengthAdjust='spacing' textLength='148.2605' x='103.125' y='317.8202'>after the store confirms</text><text fill='#FFFFFF' font-family='sans-serif' font-size='12.5' lengthAdjust='spacing' textLength='154.8035' x='103.125' y='332.371'>the write. Consistent but</text><text fill='#FFFFFF' font-family='sans-serif' font-size='12.5' lengthAdjust='spacing' textLength='83.905' x='103.125' y='346.9218'>adds latency.</text></g><g class='entity' data-qualified-name='WB.put ' data-source-line='16' id='ent0012'><ellipse cx='443.6606' cy='64.5307' fill='url(#gqs4lm54duhjd0)' rx='19.1814' ry='14.5307' style='stroke:#2FA4E7;stroke-width:2.0833;'/><text fill='#FFFFFF' font-family='sans-serif' font-size='12.5' lengthAdjust='spacing' textLength='20.7581' x='431.2949' y='68.1602'>put</text></g><g class='entity' data-qualified-name='WB.Data Container ' data-source-line='16' id='ent0013'><rect fill='url(#gqs4lm54duhjd0)' height='56.2174' rx='4.1667' ry='4.1667' style='stroke:#2FA4E7;stroke-width:1.0417;' width='150.9603' x='310.9375' y='144.7917'/><rect fill='url(#gqs4lm54duhjd0)' height='10.4167' style='stroke:#2FA4E7;stroke-width:1.0417;' width='15.625' x='441.0645' y='150'/><rect fill='url(#gqs4lm54duhjd0)' height='2.0833' style='stroke:#2FA4E7;stroke-width:1.0417;' width='4.1667' x='438.9811' y='152.0833'/><rect fill='url(#gqs4lm54duhjd0)' height='2.0833' style='stroke:#2FA4E7;stroke-width:1.0417;' width='4.1667' x='438.9811' y='156.25'/><text fill='#FFFFFF' font-family='sans-serif' font-size='12.5' lengthAdjust='spacing' textLength='94.9036' x='331.7708' y='182.4361'>Data Container</text></g><g class='entity' data-qualified-name='WB.Async Queue' data-source-line='17